name: Update steam-wayland-overlay

on:
  schedule:
    # Own minute so this repo's updaters never push together; cron only runs on the default branch.
    - cron: "35 5 * * *"
  workflow_dispatch:

# contents: write covers the bot push; the app token supplies the rest (actions: write).
permissions:
  contents: write

concurrency:
  # Never run two updaters at once.
  group: update-steam-wayland-overlay
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # main may be ruleset-protected and github-actions[bot] holds no role; the App token is the bypass actor.
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.DISPATCH_APP_ID }}
          private-key: ${{ secrets.DISPATCH_APP_PRIVATE_KEY }}
          owner: IceDOS
          repositories: |
            hardware
            cache-server
          permission-contents: write
          permission-actions: write

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      # update.sh sources core/lib/update-lib.sh; CI checks out core alongside this repo.
      - uses: actions/checkout@v4
        with:
          repository: IceDOS/core
          path: .icedos-core

      - uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            nix-path = nixpkgs=channel:nixos-unstable

      - name: Read current pin
        id: before
        run: echo "version=$(jq -r '.version' modules/drivers/steam-wayland-overlay/source.json)" >>"$GITHUB_OUTPUT"

      # Path-aware: update.sh rewrites source.json only when the overlay paths changed.
      - name: Run steam-wayland-overlay update script
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: nix-shell modules/drivers/steam-wayland-overlay/update.sh

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet modules/drivers/steam-wayland-overlay/; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
          else
            echo "changed=true" >>"$GITHUB_OUTPUT"
          fi

      # Compile the new pin before committing so a bad rev/hash never reaches main.
      - name: Build steam-wayland-overlay (verify new pin)
        if: steps.changes.outputs.changed == 'true'
        run: |
          nix-build --no-out-link -E 'with import <nixpkgs> {}; callPackage ./modules/drivers/steam-wayland-overlay/package.nix {}'

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          new=$(jq -r '.version' modules/drivers/steam-wayland-overlay/source.json)
          rev=$(jq -r '.rev' modules/drivers/steam-wayland-overlay/source.json)
          git add -A modules/drivers/steam-wayland-overlay
          git commit -m "update(steam-wayland-overlay): ${{ steps.before.outputs.version }} -> $new (${rev:0:8})"

          # Commit-then-rebase (no pull/--autostash) keeps a conflict from leaving
          # stash markers; retry until this job wins the push race.
          for attempt in 1 2 3 4 5; do
            if push_output=$(git push origin "HEAD:$GITHUB_REF_NAME" 2>&1); then
              echo "$push_output"
              exit 0
            fi
            echo "$push_output"

            # Retry only a lost race; anything else would bury the real error.
            if ! grep -qE 'fetch first|non-fast-forward' <<<"$push_output"; then
              echo "push was rejected for a reason retrying cannot fix; giving up" >&2
              exit 1
            fi

            echo "push lost a race (attempt $attempt); rebasing onto the latest $GITHUB_REF_NAME"
            # Jitter so simultaneous rejects do not retry in lockstep.
            sleep $(( (RANDOM % 5) + attempt ))

            # Each updater owns one module's files; a conflict aborts, never a half-rebase.
            if ! git pull --rebase origin "$GITHUB_REF_NAME"; then
              git rebase --abort || true
              echo "rebase onto $GITHUB_REF_NAME conflicted; aborting" >&2
              exit 1
            fi
          done

          echo "could not push after 5 attempts" >&2
          exit 1

      - name: Trigger cache-server build
        if: steps.changes.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'IceDOS',
              repo: 'cache-server',
              workflow_id: 'nix-build.yml',
              ref: 'main',
            });
