name: Update Mesa Overlays

# Thin wrapper: all logic lives in .github/workflows/module-update.yml. The
# updater opens a PR and cache-server's external build gates the merge, so this
# repo's main only advances after a green build.
on:
  schedule:
    # GitHub may delay or skip scheduled runs, and they only run on the default branch.
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions: {}

jobs:
  update:
    uses: ./.github/workflows/module-update.yml
    with:
      module: mesa
      paths: modules/graphics/modules/mesa
      command: nix-shell modules/graphics/modules/mesa/update.sh
      # Title reflects whichever overlay pins actually changed; patches-only syncs.
      title-command: |
        cd modules/graphics/modules/mesa
        body=""
        append() { if [ -n "$body" ]; then body+=", "; fi; body+="$1"; }
        if ! git diff --quiet git.json; then append "git -> $(jq -r '.rev' git.json | cut -c1-12)"; fi
        if ! git diff --quiet rc.json; then append "rc -> $(jq -r '.version' rc.json)"; fi
        [ -n "$body" ] && echo "$body" || echo "sync patches"
    secrets: inherit
